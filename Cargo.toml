[package]
name = "tuned-record"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
eframe = "0.35.0"
egui = "0.35"
env_logger = "0.11.11"
hound = "3.5.1"
jack = "0.13.5"
libloading = "0.8.9"
log = "0.4.34"
pyin = "1.2.0"
realfft = "3.5.0"
rfd = "0.17.2"
rtrb = "0.4.0"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["all"] }
toml = "1.1.8"

# DSP dependencies (pYIN, FFT, resampling) are far too slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
