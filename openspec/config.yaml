schema: sdd-with-knowledge

# Contexto inyectado en todos los artefactos del change.
context: |
  Antes de proponer cualquier cambio, consultá Graphify vía MCP.
  Tools: query_graph, get_node, get_neighbors, shortest_path.
  El grafo vive en graphify-out/graph.json y se reconstruye solo vía git hooks.

  OpenSpec maneja living specs en openspec/specs/<capability>/ (contrato formal).
  knowledge/ es el conocimiento humano curado, organizado por módulos
  (modules/<module>/use-cases/<capability>/), con un INDEX.md de navegación por dominio.
  Documenter sincroniza knowledge/ ← openspec/ post-archive vía /documenter distill.

  Regla divisoria: todo lo que Graphify puede responder (estructura del código,
  entry points, dependencias) NO vive en knowledge/. Consultar el grafo.

  Archivos de referencia para consultar durante el proposal:
    - knowledge/INDEX.md                                   — índice de módulos (entry point)
    - knowledge/architecture.md                            — overview narrativo
    - knowledge/stack.md                                   — stack con por qué de cada lib
    - knowledge/conventions.md                             — convenciones de código/proceso
    - knowledge/decisions.md                               — decisiones macro (chequear conflictos)
    - knowledge/modules/<m>/INDEX.md                       — navegación del módulo (intent → flow)
    - knowledge/modules/<m>/use-cases/<x>/spec.md          — contrato narrativo del use-case (qué debe cumplirse)
    - knowledge/modules/<m>/use-cases/<x>/flow.md          — flujo funcional end-to-end (qué pasa y por qué) + diagrama
    - knowledge/modules/<m>/use-cases/<x>/decisions.md     — decisiones del use-case (por qué se eligió)
    - knowledge/modules/<m>/use-cases/<x>/notes.md         — lore, gotchas, TODOs

  Convención de naming: el slug del capability en openspec/specs/<capability>/
  coincide 1:1 con el use-case anidado knowledge/modules/<module>/use-cases/<capability>/.
  El slug es único globalmente, así que /documenter distill resuelve la ubicación por glob
  (knowledge/modules/*/use-cases/<capability>/). La ubicación es la membresía.

  Al proponer, el primer artefacto a generar es context.md (consolidar subgrafo + knowledge).

# Guidance por operación (canal de OpenSpec >= 1.7; el piso del harness sigue siendo >= 1.9).
# Se inyecta en `openspec instructions apply|archive --json` y la leen /opsx:apply y /opsx:archive.
# Es el canal para lógica de proyecto en las operaciones — NO duplicar esto en el markdown
# de los comandos. Sólo `apply` y `archive` están soportados.
operations:
  apply:
    guidance:
      - Leer context.md y design.md antes de la primera task; el subgrafo de Graphify ya está consolidado ahí, no re-explorar con grep
      - Si durante la implementación aparece una decisión técnica nueva, anotarla en design.md — /documenter distill la destila a knowledge/ post-archive
      - No escribir en knowledge/ durante apply; knowledge/ se sincroniza post-archive vía /documenter distill
      - Si el cambio contradice knowledge/decisions.md o el decisions.md del use-case, pausar y hacerlo explícito antes de seguir

  archive:
    guidance:
      - 'Después de mover el change al archive, invocar el skill `documenter` con args `distill <target-name>`, usando el target-name con fecha (YYYY-MM-DD-<change-name>), nunca el nombre pelado: el directorio ya se movió y distill no lo encuentra bajo el nombre sin fecha'
      - 'Esto sincroniza el use-case — resuelto por glob knowledge/modules/*/use-cases/<capability>/ — con las delta specs, decisiones y lore que shippeó el change'
      - 'La convención de este repo es: archive = ready, e incluye el sync de knowledge/. Distill propone ediciones; el humano las revisa y acepta'
      - Si el change es puro tooling y no hay nada que destilar, el skill reporta "nothing to distill" y el archive se completa igual

# Reglas por tipo de artefacto
rules:
  context:
    - Derivar "Nodos afectados" y "Archivos relevantes" del subgrafo de Graphify, nunca de grep
    - Resolver el use-case por glob (knowledge/modules/*/use-cases/<capability>/) — la ubicación es la membresía, no hay frontmatter de módulo
    - Leer el INDEX.md del módulo para el mapeo intent→flow antes de listar riesgos
    - Chequear knowledge/decisions.md y el decisions.md del use-case; todo conflicto va a "Riesgos identificados"
    - No documentar estructura de código que el grafo ya responde (entry points, dependencias, layout)
    - Si el MCP de Graphify no está disponible, usar graphify-out/GRAPH_REPORT.md y dejarlo explícito como limitación

  proposal:
    - Consultar Graphify para identificar nodos/comunidades afectados antes de escribir
    - Listar en "Impact" los archivos derivados del subgrafo (no de grep)
    - Linkear use-cases relacionados de knowledge/modules/<m>/use-cases/
    - Si el change contradice knowledge/decisions.md o knowledge/modules/<m>/use-cases/<x>/decisions.md, hacerlo explícito
    - Completar "Criterios de aceptación" con comportamiento observable de dominio (prosa o bullets, sin Gherkin) — es la semilla de los scenarios Given/When/Then de specs
    - Volcar al proposal todo lo acordado en el cierre de intención (la entrevista registrada en context.md) — el contrato vive en los archivos, no en el chat
    - 'No tocar la línea "**Estado:**" al escribir el artefacto: la maneja el gate de aprobación de /opsx:propose, y toda (re)generación la deja en "Pendiente de aprobación"'

  specs:
    - No duplicar información de knowledge/ (linkear, no repetir)
    - 'Formato parseable por el CLI: requirements como "### Requirement: <nombre>" (el nombre es la clave de merge, única y estable — nunca "### REQ-N:") y scenarios como "#### Scenario: <nombre>" con Given/When/Then'
    - El texto de cada requirement debe contener SHALL o MUST (en inglés — lo exige validate --strict)
    - Emitir delta spec con secciones ADDED/MODIFIED/REMOVED/RENAMED Requirements; MODIFIED lleva el requirement completo y actualizado (todos los scenarios que sobreviven), nunca solo el diff
    - 'El capability path es un slug plano de un solo segmento (user-auth, nunca identity/user-auth): coincide 1:1 con el use-case anidado en knowledge/modules/<m>/use-cases/ (resuelto por glob)'

  design:
    - Referenciar nodos concretos del grafo (graph://node:X o graph://community:X)
    - Registrar decisiones con rationale corto; documenter las destila post-archive

  ui-ux:
    - Primera línea bajo el heading debe ser veredicto explícito ("Aplica" o "No aplica — backend-only")
    - Si "No aplica", justificar en 1 línea por qué no hay superficie de UI
    - Si "Aplica", llenar las 3 secciones (Componentes/flujos, Wireframes, Accesibilidad)
    - No duplicar lo que ya está en design.md — UI/UX es la capa visible al usuario, no el approach técnico
    - Wireframes pueden ser refs externos (Figma/Stitch) o ASCII inline; ambos válidos
    - Accesibilidad es obligatoria si "Aplica" — no opcional

  tasks:
    - 'La última task SIEMPRE debe ser: post-archive -> /documenter distill <change-id>'
    - Las tasks de implementación deben referenciar el design.md, no repetir el diseño
    - Si ui-ux.md tiene "Aplica", incluir tasks de implementación de componentes y de validación a11y
